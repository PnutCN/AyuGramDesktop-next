name: macOS

on:
  push:
    branches:
      - ayu-next
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/configure.bat'
  workflow_dispatch:
    inputs:
      only_cache:
        description: '只构建依赖库缓存,不编译应用'
        type: boolean
        default: false

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-latest

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      # 官方 Telegram Desktop 公开凭证,仅用于本地构建。
      API_ID: 2040
      API_HASH: b18441a1ff607e10a989891a5462e627

    steps:
      - name: Get repository name.
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: First set up.
        run: |
          brew install automake libtool meson nasm ninja pkg-config

          # Spotlight 会索引构建产物,拖慢整个流程。
          sudo mdutil -a -i off

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-libs-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}
          restore-keys: ${{ runner.OS }}-libs-

      # 不能加 skip-release:那会跳过 release scope 的构建,产出的 Qt 只有
      # libQt6Gui_debug.a 而没有 libQt6Gui.a,Release 编译随即链接失败。
      - name: Libraries.
        run: |
          ./$REPO_NAME/Telegram/build/prepare/mac.sh silent

      # 缓存有 10GB 上限,中间产物必须裁掉才存得下。仅在需要写入新缓存时执行,
      # 命中缓存时跳过,避免误删已经就绪的库。
      - name: Free up some disk space.
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.prl' -o -name '*.pri' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete

      - name: AyuGram Next build.
        if: github.event.inputs.only_cache != 'true'
        run: |
          cd $REPO_NAME/Telegram

          ./configure.sh \
          -D CMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
          -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -D TDESKTOP_API_ID=$API_ID \
          -D TDESKTOP_API_HASH=$API_HASH \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

          cmake --build ../out --config Release --parallel

      - name: Package.
        if: github.event.inputs.only_cache != 'true'
        run: |
          cd $REPO_NAME/out/Release

          # 调试符号占了三分之二体积,发布版不需要。必须在签名之前做,
          # 否则会让签名失效。
          strip -S -x AyuGramNext.app/Contents/MacOS/AyuGramNext

          # CI 构建关掉了签名,产物落地后补一个 adhoc 签名,否则下载下来
          # 会被 Gatekeeper 拦住,得手工 codesign 才能跑。
          codesign --force --deep --sign - AyuGramNext.app

          # 拖拽安装的 .dmg,和官方 AyuGram 的分发形式一致。
          mkdir dmgroot
          cp -R AyuGramNext.app dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create \
            -volname "AyuGram Next" \
            -srcfolder dmgroot \
            -ov -format UDZO \
            AyuGramNext-macOS.dmg

          # 保留符号链接,否则 .app 内的 Frameworks 会损坏。
          zip -r --symlinks AyuGramNext-macOS.zip AyuGramNext.app

      - name: Upload artifact.
        if: github.event.inputs.only_cache != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AyuGramNext-macOS
          path: |
            ${{ env.REPO_NAME }}/out/Release/AyuGramNext-macOS.dmg
            ${{ env.REPO_NAME }}/out/Release/AyuGramNext-macOS.zip
          retention-days: 30

      - name: Release.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.REPO_NAME }}/out/Release/AyuGramNext-macOS.dmg
            ${{ env.REPO_NAME }}/out/Release/AyuGramNext-macOS.zip
          generate_release_notes: true
